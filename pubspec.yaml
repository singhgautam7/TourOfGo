name: tourgo
description: "A Tour of Go — the official Go tour, redesigned for your phone."
publish_to: 'none'
version: 2.0.0+5

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.8.1
  shared_preferences: ^2.3.4
  http: ^1.2.2
  url_launcher: ^6.3.1
  share_plus: ^13.1.0
  package_info_plus: ^10.1.0
  device_info_plus: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.5
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.5
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/

  # Engine-registered, never runtime loads: a google_fonts FontLoader parses on
  # the UI thread and then fires fontsChange, which relayouts every route.
  # Inter (Kuber's subset) is the UI face, JetBrains Mono the code face,
  # Instrument Serif italic the About page's editorial accent.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
    - family: InstrumentSerif
      fonts:
        - asset: assets/fonts/InstrumentSerif-Italic.ttf
          style: italic

# The launcher icon is the icon family's own vector drawable, converted from
# `specs/design/app-icon/` into `android/app/src/main/res/`: an adaptive icon with
# a monochrome layer for Android 13's themed icons. `flutter_launcher_icons` is
# deliberately not used, because it would replace that vector with rasterised
# PNGs. The legacy PNGs for Android before adaptive icons and the splash art
# below are rendered from the same SVGs.

flutter_native_splash:
  # The pale ground of the icon itself, so the splash reads as the launcher
  # icon holding still rather than as a different screen.
  color: "#C8EFFE"
  color_dark: "#041E26"
  image: assets/icon/splash.png
  image_dark: assets/icon/splash_dark.png
  android_12:
    # Android 12 masks its splash icon to a circle and shows only the middle of
    # it, so this art is the glyph alone on transparent and the ground is the
    # colour below. Passing the whole icon here gets it cropped.
    image: assets/icon/splash_android12.png
    image_dark: assets/icon/splash_android12_dark.png
    icon_background_color: "#C8EFFE"
    icon_background_color_dark: "#041E26"
    color: "#C8EFFE"
    color_dark: "#041E26"
  android: true
  ios: false
  web: false
